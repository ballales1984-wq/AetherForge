<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  
  <!-- Grid lines -->
  <g stroke="rgba(6,182,212,0.08)" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>
  
  <!-- Abstract car silhouette -->
  <g transform="translate(400, 140)" filter="url(#glow)">
    <path d="M0 120 Q50 100 150 95 Q250 90 350 95 Q450 100 500 115 L500 80 L0 80 Z" 
          fill="none" stroke="rgba(6,182,212,0.4)" stroke-width="2"/>
    <circle cx="120" cy="120" r="45" fill="none" stroke="rgba(139,92,246,0.5)" stroke-width="1.5"/>
    <circle cx="380" cy="120" r="45" fill="none" stroke="rgba(139,92,246,0.5)" stroke-width="1.5"/>
  </g>
  
  <!-- Glow orbs -->
  <circle cx="200" cy="350" r="180" fill="url(#glow-grad)"/>
  <circle cx="1000" cy="80" r="150" fill="rgba(168,85,247,0.15)"/>
  
  <!-- Brand name -->
  <text x="60" y="360" font-family="monospace" font-size="72" font-weight="700" fill="white" letter-spacing="0.3em" filter="url(#text-glow)">
    AETHERFORGE
  </text>
  
  <!-- Tagline -->
  <text x="60" y="395" font-family="sans-serif" font-size="18" fill="rgba(6,182,212,0.9)" letter-spacing="0.2em">
    DIGITAL STUDIO CAR DESIGN
  </text>
  
  <!-- Tech badges -->
  <g transform="translate(750, 320)">
    <rect x="0" y="0" width="120" height="32" rx="4" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)"/>
    <text x="60" y="20" font-family="monospace" font-size="12" fill="#06b6d4" text-anchor="middle">NEXT.JS</text>
    
    <rect x="140" y="0" width="120" height="32" rx="4" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.3)"/>
    <text x="200" y="20" font-family="monospace" font-size="12" fill="#8b5cf6" text-anchor="middle">THREE.JS</text>
    
    <rect x="280" y="0" width="140" height="32" rx="4" fill="rgba(252,211,77,0.1)" stroke="rgba(252,211,77,0.3)"/>
    <text x="350" y="20" font-family="monospace" font-size="12" fill="#fcd34d" text-anchor="middle">FASTAPI</text>
  </g>
</svg>
