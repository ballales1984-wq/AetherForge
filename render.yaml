services:
  - type: web
    name: aetherforge-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: apps/api
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GROQ_API_KEY
        value: GROQ_API_KEY
    autoDeploy: true